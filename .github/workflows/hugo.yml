name: GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "latest"
          extended: true

      - name: Build
        run: hugo --minify --gc --cleanDestinationDir

      # ... (все предыдущие шаги без изменений) ...

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public # <-- ЭТО ОСТАВЛЯЕМ

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # СТРОКУ path: ./public ЗДЕСЬ УДАЛЯЕМ ПОЛНОСТЬЮ
